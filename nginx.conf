worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 全局日志禁用以提高性能
    access_log off;
    error_log /dev/null;

    # 定义 Upgrade 变量映射，用于 WebSocket 分流
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # 统一暴露 8080 端口，适合 PaaS 平台单端口限制
        listen 8080;
        server_name localhost;

        # 1. 明确指向 NodeJS-Argo 的订阅页面
        location = /sub {
            proxy_pass http://127.0.0.1:8081; # NodeJS Argo HTTP 服务的端口
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. 动态流量分发 (基于 WebSocket 识别)
        location / {
            # 默认为 Go AI 代理 (3000)
            set $target http://127.0.0.1:3000;

            # 如果请求携带 Upgrade: websocket 头，则自动判定为翻墙流量（VLESS/VMess/Trojan），分发给 NodeJS-Argo (8081)
            if ($http_upgrade = "websocket") {
                set $target http://127.0.0.1:8081;
            }

            proxy_pass $target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 关闭缓冲，保证大模型流式响应(SSE)和翻墙隧道的低延迟实时性
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
